const ChartWrapper = ({ id, type, data, options, height = 280 }) => {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (chartRef.current) chartRef.current.destroy();
    if (canvasRef.current) {
      chartRef.current = new Chart(canvasRef.current, { type, data, options });
    }
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(data)]);
  return <canvas ref={canvasRef} style={{ maxHeight: height }}></canvas>;
};

                <th className="text-center py-2 px-3 text-gray-600 font-medium">Set B Qs</th>
                <th className="text-center py-2 px-3 text-gray-600 font-medium">Set B Marks</th>

                const aqsA = SAMPLE_QUESTIONS_A.filter(q => q.clo === clo.id);
                const aqsB = SAMPLE_QUESTIONS_B.filter(q => q.clo === clo.id);
                const marksA = aqsA.reduce((s, q) => s + q.marks, 0);
                const marksB = aqsB.reduce((s, q) => s + q.marks, 0);
                const diff = Math.abs(marksA - marksB);
                const eq = diff === 0 ? 'Equivalent' : diff <= 4 ? 'Minor Diff' : 'Review';
                const eqColor = diff === 0 ? 'compliant' : diff <= 4 ? 'warning' : 'flagged';
                return (
                  <tr key={clo.id} className="border-b border-gray-50 hover:bg-gray-50">
                    <td className="py-3 pr-4"><span className="font-semibold text-blue-700">{clo.id}</span></td>
                    <td className="py-3 pr-4 text-gray-600 text-xs max-w-xs">{clo.description}</td>
                    <td className="py-3 px-3 text-center font-semibold">{aqsA.length}</td>
                    <td className="py-3 px-3 text-center font-semibold text-blue-700">{marksA}</td>
                    <td className="py-3 px-3 text-center font-semibold">{aqsB.length}</td>
                    <td className="py-3 px-3 text-center font-semibold text-teal-700">{marksB}</td>
                    <td className="py-3 px-3 text-center"><Badge type={eqColor}>{eq}</Badge></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
};

const ComparisonPage = () => {
  const [activeTab, setActiveTab] = useState('bloom');

  const totalA = SAMPLE_QUESTIONS_A.reduce((s, q) => s + q.marks, 0);
  const totalB = SAMPLE_QUESTIONS_B.reduce((s, q) => s + q.marks, 0);

  const bloomA = Object.keys(BLOOM_LEVELS).map(l => SAMPLE_QUESTIONS_A.filter(q => q.bloomLevel === l).length);
  const bloomB = Object.keys(BLOOM_LEVELS).map(l => SAMPLE_QUESTIONS_B.filter(q => q.bloomLevel === l).length);

  const cloMarksA = CLO_DATA.map(c => SAMPLE_QUESTIONS_A.filter(q => q.clo === c.id).reduce((s, q) => s + q.marks, 0));
  const cloMarksB = CLO_DATA.map(c => SAMPLE_QUESTIONS_B.filter(q => q.clo === c.id).reduce((s, q) => s + q.marks, 0));

  const topicsA = [...new Set(SAMPLE_QUESTIONS_A.map(q => q.topic))];
  const topicsB = [...new Set(SAMPLE_QUESTIONS_B.map(q => q.topic))];
  const allTopics = [...new Set([...topicsA, ...topicsB])];

  const sectionMarksA = { 'Section A': 0, 'Section B': 0, 'Section C': 0 };
  const sectionMarksB = { 'Section A': 0, 'Section B': 0, 'Section C': 0 };
  SAMPLE_QUESTIONS_A.forEach(q => { if (sectionMarksA[q.section] !== undefined) sectionMarksA[q.section] += q.marks; });
  SAMPLE_QUESTIONS_B.forEach(q => { if (sectionMarksB[q.section] !== undefined) sectionMarksB[q.section] += q.marks; });

  const avgDifficultyA = SAMPLE_QUESTIONS_A.reduce((s, q) => s + parseInt(q.bloomLevel.slice(1)), 0) / SAMPLE_QUESTIONS_A.length;
  const avgDifficultyB = SAMPLE_QUESTIONS_B.reduce((s, q) => s + parseInt(q.bloomLevel.slice(1)), 0) / SAMPLE_QUESTIONS_B.length;

  const TABS = [
    { id: 'bloom', label: "Bloom's Taxonomy" },
    { id: 'clo', label: 'CLO Coverage' },
    { id: 'marks', label: 'Mark Distribution' },
    { id: 'questions', label: 'Side-by-Side' },
  ];

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl font-bold text-gray-900">Set A vs Set B Comparison</h1>
        <p className="text-gray-500 text-sm mt-1">Equivalency analysis across cognitive levels, CLOs, and mark distribution</p>
      </div>

      {/* Summary Cards */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        {[
          { label: 'Total Marks', a: totalA, b: totalB, icon: '📊', good: totalA === totalB },
          { label: 'Avg Difficulty', a: avgDifficultyA.toFixed(2), b: avgDifficultyB.toFixed(2), icon: '🧠', good: Math.abs(avgDifficultyA - avgDifficultyB) < 0.3 },
          { label: 'Questions', a: SAMPLE_QUESTIONS_A.length, b: SAMPLE_QUESTIONS_B.length, icon: '📋', good: SAMPLE_QUESTIONS_A.length === SAMPLE_QUESTIONS_B.length },
          { label: 'CLOs Covered', a: new Set(SAMPLE_QUESTIONS_A.map(q=>q.clo)).size, b: new Set(SAMPLE_QUESTIONS_B.map(q=>q.clo)).size, icon: '🎯', good: new Set(SAMPLE_QUESTIONS_A.map(q=>q.clo)).size === new Set(SAMPLE_QUESTIONS_B.map(q=>q.clo)).size },
        ].map((item, i) => (
          <div key={i} className="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
            <div className="flex items-center justify-between mb-2">
              <span className="text-xl">{item.icon}</span>
              <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${item.good ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>

                  <td className="px-3 py-2.5"><span className="text-blue-700 font-semibold">{q.clo}</span></td>
                  <td className="px-3 py-2.5"><BloomBadge level={q.bloomLevel} /></td>
                  <td className="px-3 py-2.5 font-semibold">{q.marks}</td>
                  <td className="px-3 py-2.5">
                    <div className="flex items-center gap-1">
                      <div className="w-12 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                        <div className="h-full rounded-full" style={{width:`${q.aiAnalysis.clarity}%`,background:'#3b82f6'}}></div>
                      </div>
                      <span className="text-xs">{q.aiAnalysis.clarity}</span>
                    </div>
                  </td>
                  <td className="px-3 py-2.5">
                    <div className="flex items-center gap-1">
                      <div className="w-12 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                        <div className="h-full rounded-full" style={{width:`${q.aiAnalysis.cognitiveAlignment}%`,background:'#0d9488'}}></div>
                      </div>
                      <span className="text-xs">{q.aiAnalysis.cognitiveAlignment}</span>
                    </div>
                  </td>
                  <td className="px-3 py-2.5">
                    <div className="flex items-center gap-1">
                      <div className="w-12 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                        <div className="h-full rounded-full" style={{width:`${q.aiAnalysis.grammarScore}%`,background:'#8b5cf6'}}></div>
                      </div>
                      <span className="text-xs">{q.aiAnalysis.grammarScore}</span>
                    </div>
                  </td>
                  <td className="px-3 py-2.5">
                    <span className="text-xs">{q.bloomVerb}</span>
                    {q.bloomVerb !== q.suggestedVerb && (
                      <div className="text-xs text-teal-600">→ {q.suggestedVerb}</div>
                    )}
                  </td>
                  <td className="px-3 py-2.5">
                    <Badge type={q.complianceStatus}>
                      {q.complianceStatus === 'compliant' ? '✓' : q.complianceStatus === 'flagged' ? '🚩' : '⚠'}
                    </Badge>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Report Footer */}
      <div className="bg-gray-50 rounded-xl p-5 border border-gray-200 text-sm text-gray-600">
        <h4 className="font-semibold text-gray-700 mb-2">Report Notes</h4>
        <ul className="space-y-1 text-xs list-disc list-inside">
          <li>This report is generated in <strong>Demonstration Mode</strong> using synthetic data.</li>
          <li>FAIST guidelines have not been uploaded — compliance is assessed against built-in Bloom's Taxonomy rules only.</li>
          <li>Questions with status "Pending Guideline Verification" require FAIST upload before final clearance.</li>
          <li>AI suggestions require explicit lecturer approval before implementation. The AI does not modify questions automatically.</li>
          <li>For production use, connect to an authorised AI model via the API key configuration in Guideline Management.</li>
        </ul>
      </div>
    </div>
  );
};

// ============================================================
// PAGE: GUIDELINE MANAGEMENT
// ============================================================
const GuidelineManagementPage = () => {
  const [faistUploaded, setFaistUploaded] = useState(false);
  const [apiKey, setApiKey] = useState('');
  const [apiModel, setApiModel] = useState('gpt-4o');
  const [apiSaved, setApiSaved] = useState(false);
  const [courseName, setCourseName] = useState('Java Programming');
  const [courseCode, setCourseCode] = useState('DCS3223');
  const [semester, setSemester] = useState('Semester 2, 2024/25');
  const [cloItems, setCloItems] = useState(CLO_DATA.map(c => ({ ...c })));

  const handleFaistUpload = (e) => {
    if (e.target.files && e.target.files.length > 0) {
      setFaistUploaded(true);
    }
  };

  const handleApiSave = () => {
    setApiSaved(true);
    setTimeout(() => setApiSaved(false), 3000);
  };

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl font-bold text-gray-900">Guideline Management</h1>
        <p className="text-gray-500 text-sm mt-1">Upload FAIST guidelines, configure CLOs, and manage AI service integration</p>
      </div>

      {/* Course Information */}
      <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <h3 className="font-semibold text-gray-800 mb-4 flex items-center gap-2">
          📚 Course Information
        </h3>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          {[
            { label: 'Course Name', value: courseName, set: setCourseName },
            { label: 'Course Code', value: courseCode, set: setCourseCode },
            { label: 'Semester', value: semester, set: setSemester },
          ].map(field => (
            <div key={field.label}>
              <label className="block text-xs font-semibold text-gray-600 mb-1">{field.label}</label>
              <input type="text" value={field.value} onChange={e => field.set(e.target.value)}
                className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400" />
            </div>
          ))}
        </div>
      </div>

      {/* FAIST Upload */}
      <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <h3 className="font-semibold text-gray-800 mb-2 flex items-center gap-2">
          📄 FAIST Guidelines Upload
        </h3>
        <p className="text-xs text-gray-500 mb-4">Upload your institution's FAIST (Final Assessment Instrument Specification Template) guidelines. These are used to validate questions against institutional assessment requirements.</p>
        {faistUploaded ? (
          <div className="flex items-center gap-3 p-4 bg-green-50 border border-green-200 rounded-xl">
            <span className="text-2xl">✅</span>
            <div>
              <div className="font-semibold text-green-800 text-sm">FAIST Guidelines Uploaded</div>
              <div className="text-xs text-green-600">faist_guidelines_2024.pdf · Uploaded just now</div>
            </div>
            <button onClick={() => setFaistUploaded(false)} className="ml-auto text-xs text-red-500 hover:underline">Remove</button>
          </div>
        ) : (
          <label className="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 hover:border-teal-400 rounded-xl p-8 cursor-pointer transition-colors bg-gray-50 hover:bg-teal-50">
            <span className="text-4xl mb-3">📎</span>
            <span className="text-sm font-semibold text-gray-700 mb-1">Upload FAIST Guidelines</span>
            <span className="text-xs text-gray-400">PDF, DOCX or TXT · Max 10MB</span>
            <span className="mt-3 text-xs px-4 py-1.5 bg-teal-700 text-white rounded-lg font-semibold">Choose File</span>
            <input type="file" accept=".pdf,.docx,.txt" className="hidden" onChange={handleFaistUpload} />
          </label>
        )}
        {!faistUploaded && (
          <div className="mt-3 p-3 bg-amber-50 border border-amber-200 rounded-lg text-xs text-amber-700">
            ⚠ Without FAIST guidelines, compliance checking is limited to Bloom's Taxonomy rules only. Questions will be marked as "Pending Guideline Verification" for FAIST-specific checks.
          </div>
        )}
      </div>

      {/* CLO Management */}
      <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <h3 className="font-semibold text-gray-800 mb-4 flex items-center gap-2">
          🎯 Course Learning Outcomes (CLOs)
        </h3>
        <div className="space-y-3">
          {cloItems.map((clo, i) => (
            <div key={clo.id} className="flex gap-3 items-start p-3 bg-gray-50 rounded-lg border border-gray-100">
              <span className="text-xs font-bold text-blue-700 mt-2 w-12 flex-shrink-0">{clo.id}</span>
              <div className="flex-1 min-w-0">
                <input type="text" value={clo.description}
                  onChange={e => setCloItems(prev => prev.map((c, j) => j === i ? { ...c, description: e.target.value } : c))}
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-white" />
              </div>
              <div className="flex items-center gap-1 flex-shrink-0">
                <span className="text-xs text-gray-500">Weight:</span>
                <input type="number" value={clo.weight} min={1} max={100}
                  onChange={e => setCloItems(prev => prev.map((c, j) => j === i ? { ...c, weight: parseInt(e.target.value) } : c))}
                  className="w-14 border border-gray-200 rounded px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-teal-400" />
                <span className="text-xs text-gray-500">%</span>
              </div>
            </div>
          ))}
        </div>
        <div className="mt-3 flex justify-end">
          <button className="bg-teal-700 hover:bg-teal-800 text-white px-4 py-2 rounded-lg text-sm font-semibold">Save CLOs</button>
        </div>
      </div>

      {/* Bloom's Reference */}
      <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <h3 className="font-semibold text-gray-800 mb-4 flex items-center gap-2">
          🧠 Bloom's Taxonomy Reference
        </h3>
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          {Object.entries(BLOOM_LEVELS).map(([level, info]) => (
            <div key={level} className="rounded-lg p-3 border" style={{borderColor:info.color+'30',background:info.color+'08'}}>
              <div className="flex items-center gap-2 mb-2">
                <span className="font-bold text-sm" style={{color:info.color}}>{level}</span>
                <span className="font-semibold text-sm text-gray-700">— {info.label}</span>
              </div>
              <div className="text-xs text-gray-500 flex flex-wrap gap-1">
                {info.verbs.slice(0,6).map(v => (
                  <span key={v} className="px-1.5 py-0.5 rounded" style={{background:info.color+'15',color:info.color}}>{v}</span>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* AI Service Configuration */}
      <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <h3 className="font-semibold text-gray-800 mb-2 flex items-center gap-2">
          🤖 AI Service Configuration
        </h3>
        <div className="bg-blue-50 border border-blue-100 rounded-lg p-3 mb-4 text-xs text-blue-700">
          <strong>Privacy Notice:</strong> Examination questions are sensitive materials. Before connecting to any AI service, ensure you have explicit authorisation from your institution and that the AI provider complies with your institution's data protection policy. Do NOT transmit confidential examination materials to external services without approval.
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label className="block text-xs font-semibold text-gray-600 mb-1">AI Model</label>
            <select value={apiModel} onChange={e => setApiModel(e.target.value)}
              className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400">
              <option value="gpt-4o">OpenAI GPT-4o</option>
              <option value="gpt-4-turbo">OpenAI GPT-4 Turbo</option>
              <option value="claude-3-5">Anthropic Claude 3.5</option>
              <option value="gemini-pro">Google Gemini Pro</option>
              <option value="watsonx">IBM watsonx.ai</option>
              <option value="local">Local/Self-Hosted Model</option>
            </select>
          </div>
          <div>
            <label className="block text-xs font-semibold text-gray-600 mb-1">API Key</label>
            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)}
              placeholder="sk-… or leave blank for Demo Mode"
              className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400" />
          </div>
        </div>
        <div className="flex items-center justify-between">
          <div className="text-xs text-gray-500">
            {apiKey ? '🟡 API key entered — connect to enable live analysis' : '🟡 No API key — running in Demonstration Mode'}
          </div>
          <div className="flex gap-2">
            <button disabled={!apiKey} className="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm font-semibold disabled:opacity-40 hover:border-gray-400">
              Test Connection
            </button>
            <button onClick={handleApiSave} className="bg-teal-700 hover:bg-teal-800 text-white px-4 py-2 rounded-lg text-sm font-semibold">
              {apiSaved ? '✓ Saved!' : 'Save Settings'}
            </button>
          </div>
        </div>
      </div>

      {/* Assessment Specifications Upload */}
      <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <h3 className="font-semibold text-gray-800 mb-4 flex items-center gap-2">
          📋 Assessment Specifications
        </h3>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {[
            { label: 'Question Specification Table (QST)', sub: 'Question distribution by section and CLO', icon: '📊' },
            { label: 'Assessment Rubric', sub: 'Marking scheme and rubric template', icon: '📝' },
          ].map(spec => (
            <label key={spec.label} className="flex items-center gap-3 border border-dashed border-gray-300 hover:border-teal-400 rounded-xl p-4 cursor-pointer bg-gray-50 hover:bg-teal-50 transition-colors">
              <span className="text-3xl">{spec.icon}</span>
              <div>
                <div className="font-semibold text-sm text-gray-700">{spec.label}</div>
                <div className="text-xs text-gray-400 mt-0.5">{spec.sub}</div>
                <div className="text-xs text-teal-600 mt-1 font-medium">Click to upload</div>
              </div>
              <input type="file" className="hidden" />
            </label>
          ))}
        </div>
      </div>
    </div>
  );
};

// ============================================================
// MAIN APP
// ============================================================
const App = () => {
  const [page, setPage] = useState('overview');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

  const PAGE_TITLES = {
    overview: 'Overview Dashboard',
    review: 'Question Review',
    comparison: 'Set A vs Set B',
    compliance: 'Compliance Report',
    guidelines: 'Guideline Management',
  };

  const renderPage = () => {
    switch(page) {
      case 'overview': return <OverviewPage onNav={setPage} />;
      case 'review': return <QuestionReviewPage />;
      case 'comparison': return <ComparisonPage />;
      case 'compliance': return <ComplianceReportPage />;
      case 'guidelines': return <GuidelineManagementPage />;
      default: return <OverviewPage onNav={setPage} />;
    }
  };

  return (
    <div className="min-h-screen flex flex-col">
      <DemoBanner />
      <div className="flex flex-1">
        <Sidebar active={page} onNav={setPage} collapsed={sidebarCollapsed} onToggle={() => setSidebarCollapsed(v => !v)} />
        <div className="flex-1 flex flex-col min-w-0">
          {/* Top Bar */}
          <div className="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between sticky top-0 z-10">
            <div>
              <h2 className="text-sm font-semibold text-gray-900">{PAGE_TITLES[page]}</h2>
              <p className="text-xs text-gray-400">Java Programming • DCS3223 • Sem 2 2024/25</p>
            </div>
            <div className="flex items-center gap-3">
              <span className="text-xs bg-yellow-100 text-yellow-700 px-2.5 py-1 rounded-full font-semibold flex items-center gap-1">
                <span className="pulse-dot inline-block w-1.5 h-1.5 rounded-full bg-yellow-500"></span>
                Demo Mode
              </span>
              <div className="w-8 h-8 rounded-full flex items-center justify-center text-white text-sm font-bold" style={{background:'#1e3a5f'}}>L</div>
            </div>
          </div>

          {/* Main Content */}
          <main className="flex-1 p-6 overflow-y-auto">
            {renderPage()}
          </main>
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
